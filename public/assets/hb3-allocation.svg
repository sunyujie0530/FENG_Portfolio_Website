<svg xmlns="http://www.w3.org/2000/svg" width="687" height="150" viewBox="0 0 687 150" role="img" aria-labelledby="title desc">
  <title id="title">Hb3 hours watched allocation</title>
  <desc id="desc">Independent 42.2%, Hololive 18.5%, NIJISANJI 18%, remaining agencies 21.3%. Total 426.5 million hours. Highest viewers 96,769, average viewers 15,940, like rate 5.89%, comment rate 0.09%.</desc>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
  </style>

  <text x="0" y="16" fill="#111" font-size="13" font-weight="600">Hb3</text>
  <text x="36" y="16" fill="#8a8a8a" font-size="13">Hours watched</text>
  <text class="num" x="687" y="16" text-anchor="end" fill="#111" font-size="15" font-weight="600">426.5M</text>

  <clipPath id="bar">
    <rect x="0" y="32" width="687" height="58" rx="8"/>
  </clipPath>
  <g clip-path="url(#bar)">
    <rect x="0" y="32" width="287.38" height="58" fill="#141414"/>
    <rect x="289.38" y="32" width="125.99" height="58" fill="#4a4a4a"/>
    <rect x="417.37" y="32" width="122.58" height="58" fill="#8f8f8f"/>
    <rect x="541.95" y="32" width="145.05" height="58" fill="#e4e4e7"/>
  </g>

  <text x="16" y="55" fill="#fff" font-size="11" opacity="0.72">Independent</text>
  <text class="num" x="16" y="76" fill="#fff" font-size="18" font-weight="600">42.2%</text>

  <text x="303" y="55" fill="#fff" font-size="11" opacity="0.78">Hololive</text>
  <text class="num" x="303" y="76" fill="#fff" font-size="16" font-weight="600">18.5%</text>

  <text x="431" y="55" fill="#111" font-size="11">NIJISANJI</text>
  <text class="num" x="431" y="76" fill="#111" font-size="16" font-weight="600">18%</text>

  <text x="556" y="55" fill="#111" font-size="11">Remaining</text>
  <text class="num" x="556" y="76" fill="#111" font-size="16" font-weight="600">21.3%</text>

  <g fill="#8a8a8a" font-size="9" letter-spacing="0.08em">
    <text x="0" y="116">HIGHEST VIEWERS</text>
    <text x="176" y="116">AVG. VIEWERS</text>
    <text x="352" y="116">LIKE RATE</text>
    <text x="687" y="116" text-anchor="end">COMMENT RATE</text>
  </g>
  <g class="num" fill="#111" font-size="16" font-weight="600">
    <text x="0" y="140">96,769</text>
    <text x="176" y="140">15,940</text>
    <text x="352" y="140">5.89%</text>
    <text x="687" y="140" text-anchor="end">0.09%</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="270" height="270" viewBox="0 0 270 270" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Diminishing returns</title>
  <desc id="desc">Follower gain by stream length. Streams of about 7 hours gained 3,745 to 4,327 followers. Streams of about 15 hours gained 201 to 307. The shorter streams used 32% of airtime and brought 94% of followers.</desc>
  <g font-family="ui-sans-serif, 'PingFang SC', 'Hiragino Sans GB', sans-serif">
    <text x="86" y="26" fill="#8a8a8a" font-size="10" letter-spacing="0.08em">FOLLOWERS</text>

    <text x="78" y="54" text-anchor="end" fill="#161616" font-size="11">7h 12m</text>
    <rect x="86" y="48" width="116" height="6" rx="3" fill="#ececec"/>
    <rect x="86" y="48" width="116" height="6" rx="3" fill="#c2185b"/>
    <text x="252" y="54" text-anchor="end" fill="#c2185b" font-size="11" font-weight="500">4,327</text>

    <text x="78" y="80" text-anchor="end" fill="#161616" font-size="11">7h 30m</text>
    <rect x="86" y="74" width="116" height="6" rx="3" fill="#ececec"/>
    <rect x="86" y="74" width="103" height="6" rx="3" fill="#c2185b"/>
    <text x="252" y="80" text-anchor="end" fill="#c2185b" font-size="11">3,834</text>

    <text x="78" y="106" text-anchor="end" fill="#161616" font-size="11">7h</text>
    <rect x="86" y="100" width="116" height="6" rx="3" fill="#ececec"/>
    <rect x="86" y="100" width="100" height="6" rx="3" fill="#c2185b"/>
    <text x="252" y="106" text-anchor="end" fill="#c2185b" font-size="11">3,745</text>

    <text x="78" y="146" text-anchor="end" fill="#161616" font-size="11">15h 36m</text>
    <rect x="86" y="140" width="116" height="6" rx="3" fill="#ececec"/>
    <rect x="86" y="140" width="8" height="6" rx="3" fill="#161616"/>
    <text x="252" y="146" text-anchor="end" fill="#161616" font-size="11">307</text>

    <text x="78" y="172" text-anchor="end" fill="#161616" font-size="11">14h 48m</text>
    <rect x="86" y="166" width="116" height="6" rx="3" fill="#ececec"/>
    <rect x="86" y="166" width="7" height="6" rx="3" fill="#161616"/>
    <text x="252" y="172" text-anchor="end" fill="#161616" font-size="11">259</text>

    <text x="78" y="198" text-anchor="end" fill="#161616" font-size="11">15h</text>
    <rect x="86" y="192" width="116" height="6" rx="3" fill="#ececec"/>
    <rect x="86" y="192" width="5" height="6" rx="2.5" fill="#161616"/>
    <text x="252" y="198" text-anchor="end" fill="#161616" font-size="11">201</text>

    <line x1="16" y1="218" x2="254" y2="218" stroke="#ececec"/>
    <text x="16" y="236" fill="#8a8a8a" font-size="10">Shorter streams</text>
    <text x="16" y="254" fill="#161616" font-size="11">32% of time, 94% of followers</text>
  </g>
</svg>
